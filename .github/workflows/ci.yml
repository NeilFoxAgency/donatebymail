name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:all
      - run: npm run security:secrets
      - run: npm run contract:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm run seo:check
      - run: npx wrangler deploy --env beta --dry-run --strict
      - run: npx wrangler deploy --env= --dry-run --strict
      - run: npx wrangler types --check
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Access-protected beta smoke
        # Do not expose live Access credentials to PR-controlled installs,
        # builds, tests, or dependency lifecycle scripts. Only the trusted
        # main-branch push may receive them. A trusted release run without
        # those credentials must fail rather than report a false-green gate.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [ -z "$CF_ACCESS_CLIENT_ID" ] || [ -z "$CF_ACCESS_CLIENT_SECRET" ]; then
            echo "Access-protected beta smoke cannot run: credentials are not configured for this trusted release job."
            exit 1
          fi
          npm run smoke:beta
      - name: Production edge preflight
        # Edge settings are read-only and must be checked only on the trusted
        # release branch; never provide a Cloudflare API token to PR jobs.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Production edge preflight cannot run: Cloudflare API token is not configured for this trusted release job."
            exit 1
          fi
          npm run check:production-edge
      - name: Production Supabase Auth preflight
        # Supabase Auth redirect configuration is a remote production setting;
        # keep its exact values in trusted repository secrets rather than
        # copying beta values into source or PR-controlled logs.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SUPABASE_PRODUCTION_AUTH_SITE_URL: ${{ secrets.SUPABASE_PRODUCTION_AUTH_SITE_URL }}
          SUPABASE_PRODUCTION_AUTH_REDIRECT_URLS: ${{ secrets.SUPABASE_PRODUCTION_AUTH_REDIRECT_URLS }}
        run: |
          if [ -z "$SUPABASE_PRODUCTION_AUTH_SITE_URL" ] || [ -z "$SUPABASE_PRODUCTION_AUTH_REDIRECT_URLS" ]; then
            echo "Production Supabase Auth preflight cannot run: exact production URL settings are not configured for this trusted release job."
            exit 1
          fi
          npm run check:production-auth
      - name: Production DNS preflight
        # DNS is public read-only state, but keep the release gate on the
        # trusted branch so a PR cannot be presented as production-ready from
        # an unrelated resolver snapshot.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run check:production-dns
      - name: Authenticated agent connector smoke
        # The workspace-agent connectors are production-adjacent external
        # state. Only a trusted main-branch run may receive their ephemeral
        # bearer credentials, and a missing credential must fail closed.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
          MCP_ARTICLE_BEARER_TOKEN: ${{ secrets.MCP_ARTICLE_BEARER_TOKEN }}
        run: |
          if [ -z "$AGENT_API_KEY" ] || [ -z "$MCP_ARTICLE_BEARER_TOKEN" ]; then
            echo "Agent connector smoke cannot run: connector credentials are not configured for this trusted release job."
            exit 1
          fi
          npm run smoke:agent

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:start
      - run: npm run db:reset
      - run: npx supabase db lint --local --schema app_private,api --level warning --fail-on warning
      - run: npx supabase db advisors --local --type all --level warn --fail-on warn
      - run: npm run test:db
      - name: Generated database types are current
        run: npm run db:types && git diff --exit-code -- src/types/database.generated.ts
      - name: Actual Worker + local Supabase integration
        run: npm run test:integration
      - if: always()
        run: npm run db:stop

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Install pinned Gitleaks
        env:
          GITLEAKS_VERSION: "8.28.0"
          GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan complete Git history
        run: gitleaks git --config .gitleaks.toml --no-banner --redact .
      - name: Prove credential-shaped fixtures still fail
        run: npm run security:gitleaks-regression
